<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Poshkin — Chat Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">

<link rel="icon" type="image/svg+xml" href="../../favicon.svg">

<style>
:root {
  --bg: #080808;
  --panel: #101010;
  --panel-2: #151515;
  --border: #292929;
  --text: #f2f2f2;
  --muted: #858585;
  --accent: #ffffff;
  --green: #65d68b;
  --danger: #ff6565;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: "General Sans", sans-serif;
}

/* =========================
   LOGIN
========================= */

.login-screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  z-index: 100;
}

.login-box {
  width: min(420px, calc(100% - 40px));
  border: 1px solid var(--border);
  background: var(--panel);
  padding: 32px;
}

.login-terminal {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 24px;
}

.login-terminal b {
  color: var(--text);
}

.login-box h1 {
  margin: 0 0 8px;
  font-family: "Clash Display", sans-serif;
  font-size: 28px;
}

.login-box p {
  color: var(--muted);
  margin-bottom: 24px;
}

.input {
  width: 100%;
  padding: 13px 14px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
  background: #0b0b0b;
  color: var(--text);
  font-family: "JetBrains Mono", monospace;
  outline: none;
}

.input:focus {
  border-color: #555;
}

.btn {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--border);
  background: var(--text);
  color: #000;
  font-weight: 600;
  cursor: pointer;
}

.btn:hover {
  opacity: .85;
}

.login-error {
  display: none;
  margin-top: 14px;
  color: var(--danger);
  font-size: 13px;
}

/* =========================
   APP
========================= */

.app {
  display: none;
  height: 100vh;
  width: 100%;
}

.sidebar {
  width: 320px;
  min-width: 320px;
  border-right: 1px solid var(--border);
  background: var(--panel);
  display: flex;
  flex-direction: column;
}

.sidebar-head {
  height: 72px;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-family: "JetBrains Mono", monospace;
  font-size: 14px;
}

.logo b {
  color: var(--text);
}

.status {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 12px;
}

.status-dot {
  width: 7px;
  height: 7px;
  background: var(--green);
  border-radius: 50%;
}

.search {
  padding: 14px;
  border-bottom: 1px solid var(--border);
}

.search input {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--border);
  background: #0b0b0b;
  color: var(--text);
  outline: none;
}

.conversations {
  flex: 1;
  overflow-y: auto;
}

.conversation {
  padding: 17px 20px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}

.conversation:hover,
.conversation.active {
  background: var(--panel-2);
}

.conversation-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.visitor {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
}

.time {
  color: var(--muted);
  font-size: 11px;
}

.preview {
  margin-top: 7px;
  color: var(--muted);
  font-size: 13px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.unread {
  display: inline-flex;
  min-width: 18px;
  height: 18px;
  align-items: center;
  justify-content: center;
  background: var(--text);
  color: #000;
  border-radius: 50%;
  font-size: 10px;
  margin-left: 5px;
}

/* =========================
   CHAT
========================= */

.chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.chat-head {
  height: 72px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 25px;
}

.chat-title {
  font-family: "JetBrains Mono", monospace;
}

.chat-title small {
  display: block;
  color: var(--muted);
  margin-top: 4px;
  font-family: "General Sans", sans-serif;
  font-size: 12px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 30px;
}

.empty {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-family: "JetBrains Mono", monospace;
  text-align: center;
}

.message {
  max-width: 70%;
  margin-bottom: 18px;
}

.message.visitor {
  margin-right: auto;
}

.message.admin {
  margin-left: auto;
  text-align: right;
}

.message-bubble {
  display: inline-block;
  padding: 12px 15px;
  border: 1px solid var(--border);
  background: var(--panel);
  text-align: left;
  line-height: 1.5;
}

.message.admin .message-bubble {
  background: var(--text);
  color: #000;
  border-color: var(--text);
}

.message-meta {
  color: var(--muted);
  font-size: 10px;
  margin-top: 5px;
}

.composer {
  border-top: 1px solid var(--border);
  padding: 15px;
  display: flex;
  gap: 10px;
}

.composer textarea {
  flex: 1;
  resize: none;
  height: 48px;
  padding: 14px;
  border: 1px solid var(--border);
  background: #0b0b0b;
  color: var(--text);
  font-family: "General Sans", sans-serif;
  outline: none;
}

.send {
  width: 90px;
  border: 1px solid var(--border);
  background: var(--text);
  color: #000;
  cursor: pointer;
  font-weight: 600;
}

.send:hover {
  opacity: .85;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  .sidebar {
    width: 100%;
    min-width: 100%;
  }

  .chat {
    display: none;
  }

  .app.chat-open .sidebar {
    display: none;
  }

  .app.chat-open .chat {
    display: flex;
  }

  .messages {
    padding: 20px;
  }

  .message {
    max-width: 85%;
  }
}
</style>

</head>

<body>

<!-- LOGIN -->

<div class="login-screen" id="loginScreen">

  <div class="login-box">

```
<div class="login-terminal">
  <b>➜</b> ~/poshkin/admin $ authenticate
</div>

<h1>Chat Admin</h1>

<p>
  Sign in to access visitor conversations.
</p>

<input
  class="input"
  id="email"
  type="email"
  placeholder="admin email"
  autocomplete="username"
>

<input
  class="input"
  id="password"
  type="password"
  placeholder="password"
  autocomplete="current-password"
>

<button class="btn" id="loginBtn">
  sign in →
</button>

<div class="login-error" id="loginError">
  Invalid login.
</div>
```

  </div>

</div>

<!-- ADMIN APP -->

<div class="app" id="app">

  <!-- CONVERSATIONS -->

  <aside class="sidebar">

```
<div class="sidebar-head">

  <div class="logo">
    <b>➜</b> ~/poshkin/chat
  </div>

  <div class="status">
    <span class="status-dot"></span>
    online
  </div>

</div>

<div class="search">
  <input
    type="search"
    id="search"
    placeholder="search conversations..."
  >
</div>

<div class="conversations" id="conversations">

  <!-- Conversations will be inserted here -->

  <div class="empty">
    No conversations yet.
  </div>

</div>
```

  </aside>

  <!-- CHAT -->

  <main class="chat">

```
<header class="chat-head">

  <div class="chat-title" id="chatTitle">
    Select a conversation

    <small id="chatStatus">
      Choose a visitor from the left.
    </small>
  </div>

</header>


<section class="messages" id="messages">

  <div class="empty">
    ➜ ~/poshkin/chat $<br>
    select conversation_
  </div>

</section>


<form class="composer" id="composer">

  <textarea
    id="messageInput"
    placeholder="type a reply..."
    disabled
  ></textarea>

  <button
    class="send"
    type="submit"
    disabled
    id="sendBtn"
  >
    send →
  </button>

</form>
```

  </main>

</div>

<script>

/*
===========================================================
  TEMPORARY ADMIN INTERFACE

  Supabase authentication and realtime messaging will be
  connected here.

  DO NOT put your Supabase service-role/private key here.
===========================================================
*/


const loginScreen = document.getElementById("loginScreen");
const app = document.getElementById("app");

const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");

const conversations = document.getElementById("conversations");
const messages = document.getElementById("messages");

const chatTitle = document.getElementById("chatTitle");
const chatStatus = document.getElementById("chatStatus");

const composer = document.getElementById("composer");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

let selectedConversation = null;


/*
-----------------------------------------------------------
  LOGIN
-----------------------------------------------------------

  This is only a placeholder.

  We will replace this with Supabase Auth.
*/

loginBtn.addEventListener("click", () => {

  loginError.style.display = "none";

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (email !== "omerposhkin31@gmail.com" || password !== "Parsa@2014") {

    loginError.textContent = "Invalid email or password.";
    loginError.style.display = "block";

    return;
  }

  /*
    TEMPORARY:

    This currently lets you into the dashboard.

    DO NOT use this as real authentication.

    Supabase Auth will replace this section.
  */

  loginScreen.style.display = "none";
  app.style.display = "flex";

});


/*
-----------------------------------------------------------
  SELECT CONVERSATION
-----------------------------------------------------------
*/

function openConversation(id, visitorName) {

  selectedConversation = id;

  chatTitle.childNodes[0].textContent =
    visitorName + " ";

  chatStatus.textContent =
    "Visitor conversation";

  messageInput.disabled = false;
  sendBtn.disabled = false;

  /*
    Messages will be loaded from Supabase here.
  */

  messages.innerHTML = `
    <div class="empty">
      No messages loaded yet.
    </div>
  `;

}


/*
-----------------------------------------------------------
  SEND MESSAGE
-----------------------------------------------------------
*/

composer.addEventListener("submit", (event) => {

  event.preventDefault();

  const message = messageInput.value.trim();

  if (!message || !selectedConversation) {
    return;
  }

  /*
    Supabase message insertion will go here.
  */

  messageInput.value = "";

});


/*
-----------------------------------------------------------
  SEARCH
-----------------------------------------------------------
*/

document.getElementById("search").addEventListener("input", function() {

  const query = this.value.toLowerCase();

  document.querySelectorAll(".conversation").forEach(item => {

    const text = item.textContent.toLowerCase();

    item.style.display =
      text.includes(query) ? "" : "none";

  });

});


/*
-----------------------------------------------------------
  ENTER TO SEND
-----------------------------------------------------------
*/

messageInput.addEventListener("keydown", (event) => {

  if (event.key === "Enter" && !event.shiftKey) {

    event.preventDefault();

    composer.requestSubmit();

  }

});

</script>

</body>
</html>
