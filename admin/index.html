<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Poshkin — Chat Admin</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Caveat:wght@600&display=swap"
  rel="stylesheet"
>

<link
  href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&f[]=general-sans@400,500,600&display=swap"
  rel="stylesheet"
>

<style>

:root {
  --bg: #080808;
  --panel: #101010;
  --panel-2: #151515;
  --border: #292929;
  --text: #f2f2f2;
  --muted: #858585;
  --accent: #ffffff;
  --green: #65d68b;
  --danger: #ff6565;
  --ended: #777;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: "General Sans", sans-serif;
}


/* ==========================================
   LOGIN
========================================== */

.login-screen {
  position: fixed;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--bg);

  z-index: 100;
}

.login-box {
  width: min(420px, calc(100% - 40px));

  border: 1px solid var(--border);

  background: var(--panel);

  padding: 32px;
}

.login-terminal {
  font-family: "JetBrains Mono", monospace;

  font-size: 13px;

  color: var(--muted);

  margin-bottom: 24px;
}

.login-terminal b {
  color: var(--text);
}

.login-box h1 {
  margin: 0 0 8px;

  font-family: "Clash Display", sans-serif;

  font-size: 28px;
}

.login-box p {
  color: var(--muted);

  margin-bottom: 24px;
}

.input {
  width: 100%;

  padding: 13px 14px;

  margin-bottom: 12px;

  border: 1px solid var(--border);

  background: #0b0b0b;

  color: var(--text);

  font-family: "JetBrains Mono", monospace;

  outline: none;
}

.input:focus {
  border-color: #555;
}

.btn {
  width: 100%;

  padding: 13px;

  border: 1px solid var(--border);

  background: var(--text);

  color: #000;

  font-weight: 600;

  cursor: pointer;
}

.btn:hover {
  opacity: .85;
}

.btn:disabled {
  opacity: .5;

  cursor: wait;
}

.login-error {
  display: none;

  margin-top: 14px;

  color: var(--danger);

  font-size: 13px;
}


/* ==========================================
   APP
========================================== */

.app {
  display: none;

  height: 100vh;

  width: 100%;
}


/* ==========================================
   SIDEBAR
========================================== */

.sidebar {
  width: 320px;

  min-width: 320px;

  border-right: 1px solid var(--border);

  background: var(--panel);

  display: flex;

  flex-direction: column;
}

.sidebar-head {
  height: 72px;

  padding: 0 20px;

  border-bottom: 1px solid var(--border);

  display: flex;

  align-items: center;

  justify-content: space-between;
}

.logo {
  font-family: "JetBrains Mono", monospace;

  font-size: 14px;
}

.logo b {
  color: var(--text);
}

.status {
  display: flex;

  align-items: center;

  gap: 7px;

  color: var(--muted);

  font-size: 12px;
}

.status-dot {
  width: 7px;

  height: 7px;

  background: var(--green);

  border-radius: 50%;
}


/* ==========================================
   SEARCH
========================================== */

.search {
  padding: 14px;

  border-bottom: 1px solid var(--border);
}

.search input {
  width: 100%;

  padding: 10px;

  border: 1px solid var(--border);

  background: #0b0b0b;

  color: var(--text);

  outline: none;
}


/* ==========================================
   CONVERSATIONS
========================================== */

.conversations {
  flex: 1;

  overflow-y: auto;

  padding-bottom: 20px;
}

.section-title {
  padding: 15px 20px 8px;

  color: var(--muted);

  font-family: "JetBrains Mono", monospace;

  font-size: 10px;

  text-transform: uppercase;

  letter-spacing: .08em;
}

.section-title.archive-title {
  border-top: 1px solid var(--border);

  margin-top: 8px;
}

.conversation {
  padding: 15px 20px;

  border-bottom: 1px solid var(--border);

  cursor: pointer;
}

.conversation:hover,
.conversation.active {
  background: var(--panel-2);
}

.conversation-top {
  display: flex;

  justify-content: space-between;

  gap: 10px;
}

.visitor {
  font-family: "JetBrains Mono", monospace;

  font-size: 13px;

  min-width: 0;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}

.time {
  color: var(--muted);

  font-size: 10px;

  white-space: nowrap;
}

.preview {
  margin-top: 7px;

  color: var(--muted);

  font-size: 12px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.conversation-row {
  display: flex;

  align-items: center;

  gap: 10px;
}

.conversation-info {
  flex: 1;

  min-width: 0;
}

.conversation-status {
  display: inline-block;

  margin-top: 7px;

  font-family: "JetBrains Mono", monospace;

  font-size: 9px;

  color: var(--green);

  text-transform: uppercase;
}

.conversation-status.ended {
  color: var(--ended);
}

.delete-sidebar-btn {
  flex-shrink: 0;

  border: 1px solid transparent;

  background: transparent;

  color: var(--muted);

  font-size: 16px;

  cursor: pointer;

  padding: 5px 7px;

  opacity: 0;

  transition: .15s ease;
}

.conversation:hover .delete-sidebar-btn {
  opacity: 1;
}

.delete-sidebar-btn:hover {
  color: var(--danger);

  border-color: var(--danger);
}


/* ==========================================
   CHAT
========================================== */

.chat {
  flex: 1;

  display: flex;

  flex-direction: column;

  min-width: 0;
}

.chat-head {
  min-height: 72px;

  border-bottom: 1px solid var(--border);

  display: flex;

  align-items: center;

  padding: 0 25px;

  gap: 20px;
}

.chat-title {
  font-family: "JetBrains Mono", monospace;

  min-width: 0;
}

.chat-title small {
  display: block;

  color: var(--muted);

  margin-top: 4px;

  font-family: "General Sans", sans-serif;

  font-size: 12px;
}

.chat-actions {
  margin-left: auto;

  display: flex;

  align-items: center;

  gap: 8px;
}

.end-chat-btn {
  border: 1px solid var(--ended);

  background: transparent;

  color: #aaa;

  padding: 9px 13px;

  cursor: pointer;

  font-family: "General Sans", sans-serif;

  font-weight: 600;

  font-size: 12px;

  white-space: nowrap;
}

.end-chat-btn:hover {
  background: #aaa;

  color: #000;
}

.end-chat-btn:disabled {
  opacity: .35;

  cursor: not-allowed;
}

.end-chat-btn.ended {
  color: var(--ended);

  border-color: var(--border);

  cursor: default;
}

.delete-chat-btn {
  border: 1px solid var(--danger);

  background: transparent;

  color: var(--danger);

  padding: 9px 13px;

  cursor: pointer;

  font-family: "General Sans", sans-serif;

  font-weight: 600;

  font-size: 12px;

  white-space: nowrap;
}

.delete-chat-btn:hover {
  background: var(--danger);

  color: #000;
}

.delete-chat-btn:disabled {
  opacity: .35;

  cursor: not-allowed;
}


/* ==========================================
   CHAT ENDED BANNER
========================================== */

.ended-banner {
  display: none;

  padding: 10px 20px;

  border-bottom: 1px solid var(--border);

  background: #111;

  color: var(--muted);

  font-family: "JetBrains Mono", monospace;

  font-size: 11px;

  text-align: center;
}

.ended-banner.visible {
  display: block;
}


/* ==========================================
   MESSAGES
========================================== */

.messages {
  flex: 1;

  overflow-y: auto;

  padding: 30px;
}

.empty {
  height: 100%;

  display: flex;

  align-items: center;

  justify-content: center;

  color: var(--muted);

  font-family: "JetBrains Mono", monospace;

  text-align: center;
}

.message {
  max-width: 70%;

  margin-bottom: 18px;
}

.message.visitor {
  margin-right: auto;
}

.message.admin {
  margin-left: auto;

  text-align: right;
}

.message-bubble {
  display: inline-block;

  padding: 12px 15px;

  border: 1px solid var(--border);

  background: var(--panel);

  text-align: left;

  line-height: 1.5;

  word-break: break-word;
}

.message.admin .message-bubble {
  background: var(--text);

  color: #000;

  border-color: var(--text);
}

.message-meta {
  color: var(--muted);

  font-size: 10px;

  margin-top: 5px;
}


/* ==========================================
   COMPOSER
========================================== */

.composer {
  border-top: 1px solid var(--border);

  padding: 15px;

  display: flex;

  gap: 10px;
}

.composer textarea {
  flex: 1;

  resize: none;

  height: 48px;

  padding: 14px;

  border: 1px solid var(--border);

  background: #0b0b0b;

  color: var(--text);

  font-family: "General Sans", sans-serif;

  outline: none;
}

.composer textarea:disabled {
  opacity: .4;

  cursor: not-allowed;
}

.send {
  width: 90px;

  border: 1px solid var(--border);

  background: var(--text);

  color: #000;

  cursor: pointer;

  font-weight: 600;
}

.send:hover {
  opacity: .85;
}

.send:disabled {
  opacity: .5;

  cursor: not-allowed;
}


/* ==========================================
   MOBILE
========================================== */

@media (max-width: 700px) {

  .sidebar {
    width: 100%;

    min-width: 100%;
  }

  .chat {
    display: none;
  }

  .app.chat-open .sidebar {
    display: none;
  }

  .app.chat-open .chat {
    display: flex;
  }

  .messages {
    padding: 20px;
  }

  .message {
    max-width: 85%;
  }

  .chat-head {
    padding: 0 15px;

    gap: 8px;
  }

  .chat-actions {
    gap: 5px;
  }

  .end-chat-btn,
  .delete-chat-btn {
    padding: 8px;

    font-size: 10px;
  }

}

</style>

</head>

<body>


<!-- ==========================================
     LOGIN
========================================== -->

<div
  class="login-screen"
  id="loginScreen"
>

  <div class="login-box">

    <div class="login-terminal">
      <b>➜</b> ~/poshkin/admin $ authenticate
    </div>

    <h1>Chat Admin</h1>

    <p>
      Sign in to access visitor conversations.
    </p>

    <input
      class="input"
      id="email"
      type="email"
      placeholder="admin email"
      autocomplete="username"
    >

    <input
      class="input"
      id="password"
      type="password"
      placeholder="password"
      autocomplete="current-password"
    >

    <button
      class="btn"
      id="loginBtn"
      type="button"
    >
      sign in →
    </button>

    <div
      class="login-error"
      id="loginError"
    >
      Invalid login.
    </div>

  </div>

</div>


<!-- ==========================================
     ADMIN APP
========================================== -->

<div
  class="app"
  id="app"
>

  <aside class="sidebar">

    <div class="sidebar-head">

      <div class="logo">
        <b>➜</b> ~/poshkin/chat
      </div>

      <div class="status">

        <span class="status-dot"></span>

        online

      </div>

    </div>


    <div class="search">

      <input
        type="search"
        id="search"
        placeholder="search conversations..."
      >

    </div>


    <div
      class="conversations"
      id="conversations"
    >

      <div class="empty">
        No conversations yet.
      </div>

    </div>

  </aside>


  <!-- ========================================
       CHAT
  ========================================= -->

  <main class="chat">

    <header class="chat-head">

      <div
        class="chat-title"
        id="chatTitle"
      >

        Select a conversation

        <small id="chatStatus">
          Choose a visitor from the left.
        </small>

      </div>


      <div class="chat-actions">

        <button
          id="endChatBtn"
          class="end-chat-btn"
          type="button"
          disabled
        >
          End Chat
        </button>

        <button
          id="deleteChatBtn"
          class="delete-chat-btn"
          type="button"
          disabled
        >
          🗑 Delete
        </button>

      </div>

    </header>


    <div
      class="ended-banner"
      id="endedBanner"
    >
      This chat has ended and has been moved to the archive.
    </div>


    <section
      class="messages"
      id="messages"
    >

      <div class="empty">

        ➜ ~/poshkin/chat $<br>

        select conversation_

      </div>

    </section>


    <form
      class="composer"
      id="composer"
    >

      <textarea
        id="messageInput"
        placeholder="type a reply..."
        disabled
      ></textarea>

      <button
        class="send"
        id="sendBtn"
        type="submit"
        disabled
      >
        send →
      </button>

    </form>

  </main>

</div>


<!-- ==========================================
     SUPABASE
========================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://zrxculnvhdnqvdhrfays.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_-iZ0ectVl2b38oSSuIUAXA_7sNYaQzA";


const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* ==========================================
   DOM
========================================== */

const loginScreen =
  document.getElementById(
    "loginScreen"
  );

const app =
  document.getElementById(
    "app"
  );

const loginBtn =
  document.getElementById(
    "loginBtn"
  );

const loginError =
  document.getElementById(
    "loginError"
  );

const conversationsEl =
  document.getElementById(
    "conversations"
  );

const messagesEl =
  document.getElementById(
    "messages"
  );

const chatTitle =
  document.getElementById(
    "chatTitle"
  );

const chatStatus =
  document.getElementById(
    "chatStatus"
  );

const composer =
  document.getElementById(
    "composer"
  );

const messageInput =
  document.getElementById(
    "messageInput"
  );

const sendBtn =
  document.getElementById(
    "sendBtn"
  );

const deleteChatBtn =
  document.getElementById(
    "deleteChatBtn"
  );

const endChatBtn =
  document.getElementById(
    "endChatBtn"
  );

const endedBanner =
  document.getElementById(
    "endedBanner"
  );

const searchInput =
  document.getElementById(
    "search"
  );


/* ==========================================
   STATE
========================================== */

let selectedConversation =
  null;

let conversationsData =
  [];

let conversationsChannel =
  null;

let messagesChannel =
  null;


/* ==========================================
   LOGIN
========================================== */

loginBtn.addEventListener(
  "click",
  async () => {

    loginError.style.display =
      "none";

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    if (
      !email ||
      !password
    ) {

      loginError.textContent =
        "Enter your email and password.";

      loginError.style.display =
        "block";

      return;

    }


    loginBtn.disabled =
      true;

    loginBtn.textContent =
      "signing in...";


    const {
      error
    } =
      await db.auth.signInWithPassword({
        email,
        password
      });


    if (error) {

      console.error(
        "Login error:",
        error
      );

      loginError.textContent =
        error.message;

      loginError.style.display =
        "block";

      loginBtn.disabled =
        false;

      loginBtn.textContent =
        "sign in →";

      return;

    }


    await startAdmin();


    loginBtn.disabled =
      false;

    loginBtn.textContent =
      "sign in →";

  }
);


/* ==========================================
   START ADMIN
========================================== */

async function startAdmin() {

  const {
    data: {
      user
    }
  } =
    await db.auth.getUser();


  if (!user) {

    return;

  }


  loginScreen.style.display =
    "none";

  app.style.display =
    "flex";


  await loadConversations();

  setupRealtime();

}


/* ==========================================
   LOAD CONVERSATIONS
========================================== */

async function loadConversations() {

  const {
    data,
    error
  } =
    await db
      .from("conversations")
      .select("*")
      .order(
        "updated_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "Conversation error:",
      error
    );


    conversationsEl.innerHTML = `

      <div class="empty">

        Could not load conversations.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

    return;

  }


  conversationsData =
    data || [];


  /*
   * If the currently selected conversation
   * no longer exists, clear it.
   */

  if (
    selectedConversation &&
    !conversationsData.some(
      conversation =>
        conversation.id ===
        selectedConversation
    )
  ) {

    clearSelectedConversation(
      "This conversation was deleted."
    );

  }


  renderConversations();

}


/* ==========================================
   RENDER CONVERSATIONS
========================================== */

function renderConversations() {

  const query =
    searchInput.value
      .toLowerCase()
      .trim();


  const filtered =
    conversationsData.filter(
      conversation => {

        const name =
          conversation.visitor_name ||
          "Name missing";


        return name
          .toLowerCase()
          .includes(query);

      }
    );


  const active =
    filtered.filter(
      conversation =>
        conversation.status !==
        "ended"
    );


  const archived =
    filtered.filter(
      conversation =>
        conversation.status ===
        "ended"
    );


  conversationsEl.innerHTML =
    "";


  /*
   * ACTIVE SECTION
   */

  const activeTitle =
    document.createElement(
      "div"
    );

  activeTitle.className =
    "section-title";

  activeTitle.textContent =
    `Active Chats (${active.length})`;

  conversationsEl.appendChild(
    activeTitle
  );


  if (!active.length) {

    const emptyActive =
      document.createElement(
        "div"
      );

    emptyActive.className =
      "empty";

    emptyActive.style.height =
      "80px";

    emptyActive.textContent =
      query
        ? "No matching active chats."
        : "No active chats.";

    conversationsEl.appendChild(
      emptyActive
    );

  } else {

    active.forEach(
      conversation => {

        conversationsEl.appendChild(
          createConversationElement(
            conversation
          )
        );

      }
    );

  }


  /*
   * ARCHIVE SECTION
   */

  const archiveTitle =
    document.createElement(
      "div"
    );

  archiveTitle.className =
    "section-title archive-title";

  archiveTitle.textContent =
    `Archive (${archived.length})`;

  conversationsEl.appendChild(
    archiveTitle
  );


  if (!archived.length) {

    const emptyArchive =
      document.createElement(
        "div"
      );

    emptyArchive.className =
      "empty";

    emptyArchive.style.height =
      "80px";

    emptyArchive.textContent =
      query
        ? "No matching archived chats."
        : "No archived chats.";

    conversationsEl.appendChild(
      emptyArchive
    );

  } else {

    archived.forEach(
      conversation => {

        conversationsEl.appendChild(
          createConversationElement(
            conversation
          )
        );

      }
    );

  }

}


/* ==========================================
   CREATE SIDEBAR CONVERSATION
========================================== */

function createConversationElement(
  conversation
) {

  const item =
    document.createElement(
      "div"
    );


  item.className =
    "conversation";


  if (
    selectedConversation ===
    conversation.id
  ) {

    item.classList.add(
      "active"
    );

  }


  const name =
    conversation.visitor_name ||
    "Name missing";


  const date =
    conversation.updated_at ||
    conversation.created_at;


  const time =
    new Date(date)
      .toLocaleString();


  const isEnded =
    conversation.status ===
    "ended";


  item.innerHTML = `

    <div class="conversation-row">

      <div class="conversation-info">

        <div class="conversation-top">

          <span class="visitor">

            ${escapeHtml(name)}

          </span>

          <span class="time">

            ${escapeHtml(time)}

          </span>

        </div>

        <div class="preview">

          ${
            isEnded
              ? "Chat ended"
              : "Active conversation"
          }

        </div>

        <div
          class="conversation-status ${
            isEnded
              ? "ended"
              : ""
          }"
        >

          ${
            isEnded
              ? "● archived"
              : "● active"
          }

        </div>

      </div>


      <button
        class="delete-sidebar-btn"
        type="button"
        title="Delete chat"
        aria-label="Delete chat"
      >

        🗑

      </button>

    </div>

  `;


  item.addEventListener(
    "click",
    () => {

      openConversation(
        conversation.id
      );

    }
  );


  const deleteButton =
    item.querySelector(
      ".delete-sidebar-btn"
    );


  deleteButton.addEventListener(
    "click",
    event => {

      event.stopPropagation();


      deleteConversation(
        conversation.id
      );

    }
  );


  return item;

}


/* ==========================================
   OPEN CONVERSATION
========================================== */

async function openConversation(
  id
) {

  const conversation =
    conversationsData.find(
      item =>
        item.id === id
    );


  if (!conversation) {

    return;

  }


  selectedConversation =
    id;


  const visitorName =
    conversation.visitor_name ||
    "Name missing";


  const isEnded =
    conversation.status ===
    "ended";


  chatTitle.childNodes[0]
    .textContent =
      visitorName + " ";


  chatStatus.textContent =
    isEnded
      ? "Archived conversation"
      : "Active visitor conversation";


  /*
   * Configure buttons based on
   * conversation status.
   */

  deleteChatBtn.disabled =
    false;


  endChatBtn.disabled =
    isEnded;


  if (isEnded) {

    endChatBtn.textContent =
      "Chat Ended";

    endChatBtn.classList.add(
      "ended"
    );

  } else {

    endChatBtn.textContent =
      "End Chat";

    endChatBtn.classList.remove(
      "ended"
    );

  }


  /*
   * Configure composer.
   */

  messageInput.disabled =
    isEnded;

  sendBtn.disabled =
    isEnded;


  if (isEnded) {

    endedBanner.classList.add(
      "visible"
    );

  } else {

    endedBanner.classList.remove(
      "visible"
    );

  }


  /*
   * Mobile view.
   */

  app.classList.add(
    "chat-open"
  );


  renderConversations();


  messagesEl.innerHTML = `

    <div class="empty">

      Loading messages...

    </div>

  `;


  /*
   * Remove old message subscription.
   */

  if (messagesChannel) {

    await db.removeChannel(
      messagesChannel
    );

    messagesChannel =
      null;

  }


  const {
    data,
    error
  } =
    await db
      .from("messages")
      .select("*")
      .eq(
        "conversation_id",
        id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Messages error:",
      error
    );


    messagesEl.innerHTML = `

      <div class="empty">

        Could not load messages.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

    return;

  }


  /*
   * Make sure the user didn't switch
   * conversations while loading.
   */

  if (
    selectedConversation !== id
  ) {

    return;

  }


  renderMessages(
    data || []
  );


  /*
   * Subscribe to this conversation.
   */

  subscribeToSelectedMessages(
    id
  );

}


/* ==========================================
   RENDER MESSAGES
========================================== */

function renderMessages(
  messageList
) {

  messagesEl.innerHTML =
    "";


  if (!messageList.length) {

    messagesEl.innerHTML = `

      <div class="empty">

        No messages yet.

      </div>

    `;

    return;

  }


  messageList.forEach(
    message => {

      addMessageToScreen(
        message
      );

    }
  );


  scrollToBottom();

}


/* ==========================================
   ADD MESSAGE
========================================== */

function addMessageToScreen(
  message
) {

  const existing =
    document.querySelector(
      `[data-message-id="${message.id}"]`
    );


  if (existing) {

    return;

  }


  const empty =
    messagesEl.querySelector(
      ".empty"
    );


  if (empty) {

    empty.remove();

  }


  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    `message ${message.sender}`;


  wrapper.dataset.messageId =
    message.id;


  const time =
    new Date(
      message.created_at
    ).toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );


  wrapper.innerHTML = `

    <div class="message-bubble">

      ${escapeHtml(
        message.message
      )}

    </div>

    <div class="message-meta">

      ${
        message.sender === "admin"
          ? "you"
          : "visitor"
      }

      ·

      ${escapeHtml(time)}

    </div>

  `;


  messagesEl.appendChild(
    wrapper
  );

}


/* ==========================================
   SELECTED MESSAGE REALTIME
========================================== */

function subscribeToSelectedMessages(
  conversationId
) {

  messagesChannel =
    db
      .channel(
        "admin-selected-messages-" +
        conversationId
      )

      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        payload => {

          if (
            selectedConversation !==
            conversationId
          ) {

            return;

          }


          addMessageToScreen(
            payload.new
          );


          scrollToBottom();


          /*
           * Refresh sidebar so the
           * conversation timestamp moves.
           */

          loadConversations();

        }
      )

      .subscribe(
        status => {

          console.log(
            "Selected messages realtime:",
            status
          );

        }
      );

}


/* ==========================================
   SEND ADMIN MESSAGE
========================================== */

composer.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const message =
      messageInput.value.trim();


    if (
      !message ||
      !selectedConversation
    ) {

      return;

    }


    const conversation =
      conversationsData.find(
        item =>
          item.id ===
          selectedConversation
      );


    /*
     * Never allow replies to ended chats.
     */

    if (
      !conversation ||
      conversation.status ===
      "ended"
    ) {

      return;

    }


    sendBtn.disabled =
      true;


    const conversationId =
      selectedConversation;


    const {
      error
    } =
      await db
        .from("messages")
        .insert({

          conversation_id:
            conversationId,

          sender:
            "admin",

          message:
            message

        });


    if (error) {

      console.error(
        "Send error:",
        error
      );


      alert(
        "Could not send message:\n\n" +
        error.message
      );


      sendBtn.disabled =
        false;


      return;

    }


    /*
     * The database trigger already updates
     * updated_at, but this keeps the sidebar
     * current immediately.
     */

    const {
      error: updateError
    } =
      await db
        .from("conversations")
        .update({
          updated_at:
            new Date().toISOString()
        })
        .eq(
          "id",
          conversationId
        );


    if (updateError) {

      console.error(
        "Update error:",
        updateError
      );

    }


    messageInput.value =
      "";


    sendBtn.disabled =
      false;


    messageInput.focus();

  }
);


/* ==========================================
   END CHAT
========================================== */

endChatBtn.addEventListener(
  "click",
  async () => {

    if (
      !selectedConversation
    ) {

      return;

    }


    const conversation =
      conversationsData.find(
        item =>
          item.id ===
          selectedConversation
      );


    if (!conversation) {

      return;

    }


    if (
      conversation.status ===
      "ended"
    ) {

      return;

    }


    const name =
      conversation.visitor_name ||
      "this visitor";


    const confirmed =
      confirm(
        `End the chat with ${name}?\n\n` +
        "The visitor will be notified and " +
        "will no longer be able to send messages " +
        "in this chat."
      );


    if (!confirmed) {

      return;

    }


    endChatBtn.disabled =
      true;

    endChatBtn.textContent =
      "Ending...";


    const {
      error
    } =
      await db
        .from("conversations")
        .update({

          status:
            "ended",

          ended_at:
            new Date().toISOString(),

          updated_at:
            new Date().toISOString()

        })
        .eq(
          "id",
          selectedConversation
        );


    if (error) {

      console.error(
        "End chat error:",
        error
      );


      alert(
        "Could not end chat:\n\n" +
        error.message
      );


      endChatBtn.disabled =
        false;

      endChatBtn.textContent =
        "End Chat";


      return;

    }


    /*
     * Update the local conversation
     * immediately.
     */

    const localConversation =
      conversationsData.find(
        item =>
          item.id ===
          selectedConversation
      );


    if (localConversation) {

      localConversation.status =
        "ended";

      localConversation.ended_at =
        new Date().toISOString();

    }


    /*
     * Disable the composer.
     */

    messageInput.disabled =
      true;

    sendBtn.disabled =
      true;


    /*
     * Show ended state.
     */

    chatStatus.textContent =
      "Archived conversation";


    endedBanner.classList.add(
      "visible"
    );


    endChatBtn.textContent =
      "Chat Ended";

    endChatBtn.classList.add(
      "ended"
    );


    endChatBtn.disabled =
      true;


    renderConversations();

  }
);


/* ==========================================
   DELETE CONVERSATION
========================================== */

async function deleteConversation(
  conversationId
) {

  if (!conversationId) {

    return;

  }


  const conversation =
    conversationsData.find(
      item =>
        item.id ===
        conversationId
    );


  const name =
    conversation?.visitor_name ||
    "this visitor";


  const confirmed =
    confirm(
      `Delete the chat with ${name}?\n\n` +
      "This permanently deletes the conversation " +
      "and all messages in it."
    );


  if (!confirmed) {

    return;

  }


  /*
   * Disable controls immediately.
   */

  if (
    selectedConversation ===
    conversationId
  ) {

    sendBtn.disabled =
      true;

    messageInput.disabled =
      true;

    deleteChatBtn.disabled =
      true;

    endChatBtn.disabled =
      true;

  }


  const {
    error
  } =
    await db
      .from("conversations")
      .delete()
      .eq(
        "id",
        conversationId
      );


  if (error) {

    console.error(
      "Delete conversation error:",
      error
    );


    alert(
      "Could not delete chat:\n\n" +
      error.message
    );


    if (
      selectedConversation ===
      conversationId
    ) {

      const stillExists =
        conversationsData.find(
          item =>
            item.id ===
            conversationId
        );


      if (stillExists) {

        messageInput.disabled =
          stillExists.status ===
          "ended";

        sendBtn.disabled =
          stillExists.status ===
          "ended";

        deleteChatBtn.disabled =
          false;

        endChatBtn.disabled =
          stillExists.status ===
          "ended";

      }

    }


    return;

  }


  /*
   * Remove locally immediately.
   */

  conversationsData =
    conversationsData.filter(
      item =>
        item.id !==
        conversationId
    );


  /*
   * Clear selected chat if necessary.
   */

  if (
    selectedConversation ===
    conversationId
  ) {

    clearSelectedConversation(
      "conversation_deleted_"
    );

  }


  renderConversations();

}


/* ==========================================
   CLEAR SELECTED CONVERSATION
========================================== */

function clearSelectedConversation(
  statusText
) {

  selectedConversation =
    null;


  if (messagesChannel) {

    db.removeChannel(
      messagesChannel
    );

    messagesChannel =
      null;

  }


  chatTitle.childNodes[0]
    .textContent =
      "Select a conversation ";


  chatStatus.textContent =
    statusText ||
    "Choose a visitor from the left.";


  messagesEl.innerHTML = `

    <div class="empty">

      ➜ ~/poshkin/chat $<br>

      ${escapeHtml(
        statusText ||
        "select conversation_"
      )}

    </div>

  `;


  messageInput.value =
    "";

  messageInput.disabled =
    true;

  sendBtn.disabled =
    true;

  deleteChatBtn.disabled =
    true;

  endChatBtn.disabled =
    true;

  endChatBtn.textContent =
    "End Chat";

  endChatBtn.classList.remove(
    "ended"
  );

  endedBanner.classList.remove(
    "visible"
  );


  app.classList.remove(
    "chat-open"
  );

}


/* ==========================================
   REALTIME
========================================== */

function setupRealtime() {

  if (
    conversationsChannel
  ) {

    db.removeChannel(
      conversationsChannel
    );

  }


  /*
   * CONVERSATIONS
   */

  conversationsChannel =
    db
      .channel(
        "admin-conversations"
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "conversations"
        },
        async payload => {

          console.log(
            "Conversation update:",
            payload
          );


          /*
           * Conversation deleted.
           */

          if (
            payload.eventType ===
            "DELETE"
          ) {

            if (
              selectedConversation ===
              payload.old.id
            ) {

              clearSelectedConversation(
                "This conversation was deleted."
              );

            }

          }


          /*
           * Conversation updated.
           *
           * This catches the admin ending
           * a conversation and moves it into
           * the archive.
           */

          if (
            payload.eventType ===
            "UPDATE"
          ) {

            if (
              selectedConversation ===
              payload.new.id &&
              payload.new.status ===
              "ended"
            ) {

              messageInput.disabled =
                true;

              sendBtn.disabled =
                true;

              endChatBtn.disabled =
                true;

              endChatBtn.textContent =
                "Chat Ended";

              endChatBtn.classList.add(
                "ended"
              );

              chatStatus.textContent =
                "Archived conversation";

              endedBanner.classList.add(
                "visible"
              );

            }

          }


          await loadConversations();

        }
      )

      .subscribe(
        status => {

          console.log(
            "Conversation realtime:",
            status
          );

        }
      );


  /*
   * GLOBAL NEW MESSAGES
   */

  /*
   * We don't need a second permanent
   * messages subscription here because
   * the selected conversation gets its
   * own subscription above.
   */

}


/* ==========================================
   SEARCH
========================================== */

searchInput.addEventListener(
  "input",
  () => {

    renderConversations();

  }
);


/* ==========================================
   ENTER TO SEND
========================================== */

messageInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();


      if (
        !messageInput.disabled
      ) {

        composer.requestSubmit();

      }

    }

  }
);


/* ==========================================
   SCROLL
========================================== */

function scrollToBottom() {

  messagesEl.scrollTop =
    messagesEl.scrollHeight;

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(
  value
) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* ==========================================
   MOBILE BACK
========================================== */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape" &&
      window.innerWidth <= 700
    ) {

      app.classList.remove(
        "chat-open"
      );

    }

  }
);


/* ==========================================
   INITIALIZE
========================================== */

(async function init() {

  try {

    const {
      data: {
        session
      }
    } =
      await db.auth.getSession();


    if (session) {

      await startAdmin();

    }

  }

  catch (error) {

    console.error(
      "Startup error:",
      error
    );

  }

})();


/* ==========================================
   AUTH STATE
========================================== */

db.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    console.log(
      "Auth state:",
      event
    );


    if (
      event ===
      "SIGNED_OUT"
    ) {

      loginScreen.style.display =
        "flex";

      app.style.display =
        "none";


      selectedConversation =
        null;


      conversationsData =
        [];


      if (
        conversationsChannel
      ) {

        db.removeChannel(
          conversationsChannel
        );

        conversationsChannel =
          null;

      }


      if (
        messagesChannel
      ) {

        db.removeChannel(
          messagesChannel
        );

        messagesChannel =
          null;

      }

    }

  }
);

</script>
