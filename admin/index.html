<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Poshkin — Chat Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap"
  rel="stylesheet"
>

<link
  href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&f[]=general-sans@400,500,600&display=swap"
  rel="stylesheet"
>

<style>

/* =========================================================
   VARIABLES
========================================================= */

:root {

  --bg: #080808;
  --panel: #101010;
  --panel-2: #151515;
  --border: #292929;

  --text: #f2f2f2;
  --muted: #858585;

  --green: #65d68b;
  --danger: #ff6565;
  --orange: #ffb35c;

}


/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

}

body {

  background: var(--bg);
  color: var(--text);

  font-family: "General Sans", sans-serif;

}


/* =========================================================
   LOGIN
========================================================= */

.login-screen {

  position: fixed;

  inset: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  background: var(--bg);

  z-index: 100;

}

.login-box {

  width: min(420px, calc(100% - 40px));

  border: 1px solid var(--border);

  background: var(--panel);

  padding: 32px;

}

.login-terminal {

  font-family: "JetBrains Mono", monospace;

  font-size: 13px;

  color: var(--muted);

  margin-bottom: 24px;

}

.login-terminal b {

  color: var(--text);

}

.login-box h1 {

  margin: 0 0 8px;

  font-family: "Clash Display", sans-serif;

  font-size: 28px;

}

.login-box p {

  color: var(--muted);

  margin-bottom: 24px;

}

.input {

  width: 100%;

  padding: 13px 14px;

  margin-bottom: 12px;

  border: 1px solid var(--border);

  background: #0b0b0b;

  color: var(--text);

  font-family: "JetBrains Mono", monospace;

  outline: none;

}

.input:focus {

  border-color: #555;

}

.login-button {

  width: 100%;

  padding: 13px;

  border: 1px solid var(--border);

  background: var(--text);

  color: #000;

  font-weight: 600;

  cursor: pointer;

}

.login-button:hover {

  opacity: .85;

}

.login-error {

  display: none;

  margin-top: 14px;

  color: var(--danger);

  font-size: 13px;

}


/* =========================================================
   APP
========================================================= */

.app {

  display: none;

  height: 100vh;
  width: 100%;

}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

  width: 330px;

  min-width: 330px;

  border-right: 1px solid var(--border);

  background: var(--panel);

  display: flex;

  flex-direction: column;

}

.sidebar-head {

  height: 72px;

  padding: 0 20px;

  border-bottom: 1px solid var(--border);

  display: flex;

  align-items: center;

  justify-content: space-between;

}

.logo {

  font-family: "JetBrains Mono", monospace;

  font-size: 14px;

}

.logo b {

  color: var(--text);

}

.status {

  display: flex;

  align-items: center;

  gap: 7px;

  color: var(--muted);

  font-size: 12px;

}

.status-dot {

  width: 7px;

  height: 7px;

  background: var(--green);

  border-radius: 50%;

}


/* =========================================================
   SEARCH
========================================================= */

.search {

  padding: 14px;

  border-bottom: 1px solid var(--border);

}

.search input {

  width: 100%;

  padding: 10px;

  border: 1px solid var(--border);

  background: #0b0b0b;

  color: var(--text);

  outline: none;

  font-family: "General Sans", sans-serif;

}


/* =========================================================
   CONVERSATION LIST
========================================================= */

.conversations {

  flex: 1;

  overflow-y: auto;

}

.section-title {

  padding: 14px 20px 8px;

  color: #666;

  font-family: "JetBrains Mono", monospace;

  font-size: 10px;

  letter-spacing: 1.5px;

}

.conversation {

  padding: 15px 20px;

  border-bottom: 1px solid var(--border);

  cursor: pointer;

  transition: background .15s ease;

}

.conversation:hover,
.conversation.active {

  background: var(--panel-2);

}

.conversation-top {

  display: flex;

  justify-content: space-between;

  gap: 10px;

}

.visitor {

  font-family: "JetBrains Mono", monospace;

  font-size: 13px;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

}

.time {

  color: var(--muted);

  font-size: 10px;

  white-space: nowrap;

}

.preview {

  margin-top: 7px;

  color: var(--muted);

  font-size: 12px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}

.conversation-status {

  display: inline-block;

  margin-top: 8px;

  font-size: 9px;

  font-family: "JetBrains Mono", monospace;

  padding: 3px 6px;

  border: 1px solid rgba(101,214,139,.25);

  color: var(--green);

}

.conversation-status.ended {

  border-color: rgba(255,255,255,.12);

  color: #666;

}

.delete-small {

  float: right;

  margin-top: 7px;

  border: 0;

  background: transparent;

  color: #555;

  cursor: pointer;

  font-size: 13px;

  padding: 2px 4px;

}

.delete-small:hover {

  color: var(--danger);

}

.list-empty {

  padding: 35px 20px;

  text-align: center;

  color: #555;

  font-family: "JetBrains Mono", monospace;

  font-size: 11px;

}


/* =========================================================
   CHAT AREA
========================================================= */

.chat {

  flex: 1;

  display: flex;

  flex-direction: column;

  min-width: 0;

}

.chat-head {

  min-height: 72px;

  border-bottom: 1px solid var(--border);

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 12px 25px;

  gap: 20px;

}

.chat-title {

  font-family: "JetBrains Mono", monospace;

  min-width: 0;

}

.chat-title-name {

  font-size: 14px;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

}

.chat-title small {

  display: block;

  color: var(--muted);

  margin-top: 5px;

  font-family: "General Sans", sans-serif;

  font-size: 11px;

}

.chat-actions {

  display: flex;

  align-items: center;

  gap: 8px;

  flex-shrink: 0;

}

.action-button {

  border: 1px solid var(--border);

  background: #111;

  color: var(--text);

  padding: 9px 12px;

  cursor: pointer;

  font-size: 11px;

  font-family: "General Sans", sans-serif;

}

.action-button:hover {

  background: #1b1b1b;

}

.action-button.end {

  color: var(--orange);

  border-color: rgba(255,179,92,.25);

}

.action-button.delete {

  color: var(--danger);

  border-color: rgba(255,101,101,.2);

}

.action-button:disabled {

  opacity: .35;

  cursor: not-allowed;

}


/* =========================================================
   MESSAGES
========================================================= */

.messages {

  flex: 1;

  overflow-y: auto;

  padding: 30px;

}

.empty {

  height: 100%;

  display: flex;

  align-items: center;

  justify-content: center;

  color: var(--muted);

  font-family: "JetBrains Mono", monospace;

  text-align: center;

  line-height: 1.7;

}

.message {

  max-width: 70%;

  margin-bottom: 18px;

}

.message.visitor {

  margin-right: auto;

}

.message.admin {

  margin-left: auto;

  text-align: right;

}

.message-bubble {

  display: inline-block;

  padding: 12px 15px;

  border: 1px solid var(--border);

  background: var(--panel);

  text-align: left;

  line-height: 1.5;

  word-break: break-word;

}

.message.admin .message-bubble {

  background: var(--text);

  color: #000;

  border-color: var(--text);

}

.message-meta {

  color: var(--muted);

  font-size: 10px;

  margin-top: 5px;

}

.system-message {

  text-align: center;

  color: #666;

  font-family: "JetBrains Mono", monospace;

  font-size: 10px;

  margin: 20px 0;

}


/* =========================================================
   QUICK REPLIES
========================================================= */

.quick-replies {

  border-top: 1px solid var(--border);

  padding: 10px 15px;

  background: #0d0d0d;

}

.quick-replies-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 8px;

}

.quick-replies-title {

  color: #666;

  font-family: "JetBrains Mono", monospace;

  font-size: 9px;

  letter-spacing: 1.5px;

}

.quick-replies-list {

  display: flex;

  gap: 7px;

  flex-wrap: wrap;

}

.quick-reply {

  border: 1px solid #292929;

  background: #151515;

  color: #aaa;

  padding: 8px 10px;

  border-radius: 4px;

  font-family: "General Sans", sans-serif;

  font-size: 11px;

  cursor: pointer;

  transition: .15s ease;

  text-align: left;

}

.quick-reply:hover {

  background: #202020;

  border-color: #444;

  color: #fff;

}

.quick-reply:active {

  transform: scale(.98);

}

.quick-reply:disabled {

  opacity: .35;

  cursor: not-allowed;

}


/* =========================================================
   COMPOSER
========================================================= */

.composer {

  border-top: 1px solid var(--border);

  padding: 15px;

  display: flex;

  gap: 10px;

}

.composer textarea {

  flex: 1;

  resize: none;

  height: 48px;

  padding: 14px;

  border: 1px solid var(--border);

  background: #0b0b0b;

  color: var(--text);

  font-family: "General Sans", sans-serif;

  outline: none;

}

.send {

  width: 90px;

  border: 1px solid var(--border);

  background: var(--text);

  color: #000;

  cursor: pointer;

  font-weight: 600;

}

.send:hover {

  opacity: .85;

}

.send:disabled {

  opacity: .35;

  cursor: not-allowed;

}


/* =========================================================
   ENDED STATE
========================================================= */

.chat-ended-bar {

  display: none;

  padding: 12px 15px;

  border-top: 1px solid var(--border);

  background: #111;

  color: #777;

  font-family: "JetBrains Mono", monospace;

  font-size: 10px;

  text-align: center;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

  .sidebar {

    width: 100%;

    min-width: 100%;

  }

  .chat {

    display: none;

  }

  .app.chat-open .sidebar {

    display: none;

  }

  .app.chat-open .chat {

    display: flex;

  }

  .messages {

    padding: 20px;

  }

  .message {

    max-width: 85%;

  }

  .chat-head {

    padding: 12px 15px;

  }

  .chat-actions {

    gap: 5px;

  }

  .action-button {

    padding: 8px;

    font-size: 10px;

  }

  .quick-reply {

    font-size: 10px;

  }

}

</style>

</head>


<body>


<!-- =======================================================
     LOGIN
======================================================= -->

<div class="login-screen" id="loginScreen">

  <div class="login-box">

    <div class="login-terminal">
      <b>➜</b> ~/poshkin/admin $ authenticate
    </div>

    <h1>Chat Admin</h1>

    <p>
      Sign in to access visitor conversations.
    </p>

    <input
      class="input"
      id="email"
      type="email"
      placeholder="admin email"
      autocomplete="username"
    >

    <input
      class="input"
      id="password"
      type="password"
      placeholder="password"
      autocomplete="current-password"
    >

    <button
      class="login-button"
      id="loginBtn"
      type="button"
    >
      sign in →
    </button>

    <div
      class="login-error"
      id="loginError"
    ></div>

  </div>

</div>


<!-- =======================================================
     ADMIN APP
======================================================= -->

<div
  class="app"
  id="app"
>


  <!-- =====================================================
       SIDEBAR
  ====================================================== -->

  <aside class="sidebar">


    <div class="sidebar-head">

      <div class="logo">
        <b>➜</b> ~/poshkin/chat
      </div>

      <div class="status">

        <span class="status-dot"></span>

        online

      </div>

    </div>


    <div class="search">

      <input
        type="search"
        id="search"
        placeholder="search conversations..."
      >

    </div>


    <div
      class="conversations"
      id="conversations"
    >

      <div class="list-empty">
        Loading...
      </div>

    </div>


  </aside>


  <!-- =====================================================
       CHAT
  ====================================================== -->

  <main class="chat">


    <header class="chat-head">


      <div
        class="chat-title"
        id="chatTitle"
      >

        <div
          class="chat-title-name"
          id="chatTitleName"
        >
          Select a conversation
        </div>

        <small id="chatStatus">
          Choose a visitor from the left.
        </small>

      </div>


      <div class="chat-actions">

        <button
          class="action-button end"
          id="endChatBtn"
          type="button"
          disabled
        >
          End Chat
        </button>

        <button
          class="action-button delete"
          id="deleteChatBtn"
          type="button"
          disabled
        >
          🗑 Delete
        </button>

      </div>


    </header>


    <section
      class="messages"
      id="messages"
    >

      <div class="empty">

        ➜ ~/poshkin/chat $<br>
        select conversation_

      </div>

    </section>


    <!-- QUICK REPLIES -->

    <div
      class="quick-replies"
      id="quickReplies"
    >

      <div class="quick-replies-header">

        <span class="quick-replies-title">
          QUICK REPLIES
        </span>

      </div>


      <div class="quick-replies-list">


        <button
          type="button"
          class="quick-reply"
          data-message="Hey there, How can I help you?"
        >
          Hey there, How can I help you?
        </button>


        <button
          type="button"
          class="quick-reply"
          data-message="Thank you for contacting us, if you have any more questions feel free to open a new chat. Have a great day!"
        >
          Thank you for contacting us...
        </button>


        <button
          type="button"
          class="quick-reply"
          data-message="Thanks for reaching out! I'll get back to you as soon as possible."
        >
          I'll get back to you soon.
        </button>


        <button
          type="button"
          class="quick-reply"
          data-message="You're very welcome! If you need anything else, just let me know."
        >
          You're very welcome!
        </button>


      </div>

    </div>


    <!-- ENDED BAR -->

    <div
      class="chat-ended-bar"
      id="chatEndedBar"
    >
      This chat has ended. The visitor must start a new chat to continue.
    </div>


    <!-- COMPOSER -->

    <form
      class="composer"
      id="composer"
    >

      <textarea
        id="messageInput"
        maxlength="2000"
        placeholder="type a reply..."
        disabled
      ></textarea>


      <button
        class="send"
        type="submit"
        id="sendBtn"
        disabled
      >
        send →
      </button>

    </form>


  </main>


</div>


<!-- =======================================================
     SUPABASE
======================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
  "https://zrxculnvhdnqvdhrfays.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-iZ0ectVl2b38oSSuIUAXA_7sNYaQzA";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const loginBtn =
  document.getElementById("loginBtn");

const loginError =
  document.getElementById("loginError");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const conversationsEl =
  document.getElementById("conversations");

const messagesEl =
  document.getElementById("messages");

const searchInput =
  document.getElementById("search");

const chatTitleName =
  document.getElementById("chatTitleName");

const chatStatus =
  document.getElementById("chatStatus");

const composer =
  document.getElementById("composer");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const endChatBtn =
  document.getElementById("endChatBtn");

const deleteChatBtn =
  document.getElementById("deleteChatBtn");

const chatEndedBar =
  document.getElementById("chatEndedBar");

const quickReplyButtons =
  document.querySelectorAll(".quick-reply");


/* =========================================================
   STATE
========================================================= */

let conversations = [];

let selectedConversation = null;

let realtimeChannel = null;

let loggedIn = false;


/* =========================================================
   LOGIN
========================================================= */

loginBtn.addEventListener(
  "click",
  login
);


passwordInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      login();

    }

  }
);


async function login() {

  loginError.style.display = "none";

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  if (!email || !password) {

    loginError.textContent =
      "Enter your email and password.";

    loginError.style.display =
      "block";

    return;

  }


  loginBtn.disabled = true;

  loginBtn.textContent =
    "signing in...";


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


  if (error) {

    console.error(error);

    loginError.textContent =
      "Invalid email or password.";

    loginError.style.display =
      "block";

    loginBtn.disabled = false;

    loginBtn.textContent =
      "sign in →";

    return;

  }


  if (!data.session) {

    loginError.textContent =
      "Could not create a session.";

    loginError.style.display =
      "block";

    loginBtn.disabled = false;

    loginBtn.textContent =
      "sign in →";

    return;

  }


  loggedIn = true;


  loginScreen.style.display =
    "none";

  app.style.display =
    "flex";


  await loadConversations();

  subscribeToRealtime();

}


/* =========================================================
   LOAD CONVERSATIONS
========================================================= */

async function loadConversations() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("conversations")
      .select("*")
      .order(
        "updated_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "Conversation loading error:",
      error
    );

    conversationsEl.innerHTML = `
      <div class="list-empty">
        Could not load conversations.
      </div>
    `;

    return;

  }


  conversations =
    data || [];


  renderConversations();

}


/* =========================================================
   RENDER CONVERSATIONS
========================================================= */

function renderConversations() {

  const query =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    conversations.filter(
      conversation => {

        const name =
          (
            conversation.visitor_name ||
            "Name missing"
          ).toLowerCase();

        return name.includes(query);

      }
    );


  const active =
    filtered.filter(
      conversation =>
        conversation.status !== "ended"
    );


  const archived =
    filtered.filter(
      conversation =>
        conversation.status === "ended"
    );


  let html = "";


  /* =======================================================
     ACTIVE
  ====================================================== */

  html += `
    <div class="section-title">
      ACTIVE CHATS
    </div>
  `;


  if (active.length === 0) {

    html += `
      <div class="list-empty">
        No active chats.
      </div>
    `;

  }


  active.forEach(
    conversation => {

      html +=
        conversationHTML(
          conversation
        );

    }
  );


  /* =======================================================
     ARCHIVE
  ====================================================== */

  html += `
    <div class="section-title">
      ARCHIVE
    </div>
  `;


  if (archived.length === 0) {

    html += `
      <div class="list-empty">
        No archived chats.
      </div>
    `;

  }


  archived.forEach(
    conversation => {

      html +=
        conversationHTML(
          conversation
        );

    }
  );


  conversationsEl.innerHTML =
    html;


  document
    .querySelectorAll(
      ".conversation"
    )
    .forEach(
      element => {

        element.addEventListener(
          "click",
          event => {

            if (
              event.target.closest(
                ".delete-small"
              )
            ) {

              return;

            }


            const id =
              element.dataset.id;


            const conversation =
              conversations.find(
                item =>
                  item.id === id
              );


            if (conversation) {

              openConversation(
                conversation
              );

            }

          }
        );

      }
    );


  document
    .querySelectorAll(
      ".delete-small"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          async event => {

            event.stopPropagation();

            const id =
              button.dataset.id;

            await deleteConversation(
              id
            );

          }
        );

      }
    );

}


/* =========================================================
   CONVERSATION HTML
========================================================= */

function conversationHTML(
  conversation
) {

  const name =
    conversation.visitor_name ||
    "Name missing";


  const updated =
    conversation.updated_at ||
    conversation.created_at;


  const time =
    formatTime(updated);


  const ended =
    conversation.status ===
    "ended";


  const isActive =
    selectedConversation &&
    selectedConversation.id ===
    conversation.id;


  return `

    <div
      class="conversation ${isActive ? "active" : ""}"
      data-id="${escapeHtml(conversation.id)}"
    >

      <div class="conversation-top">

        <div class="visitor">
          ${escapeHtml(name)}
        </div>

        <div class="time">
          ${escapeHtml(time)}
        </div>

      </div>


      <div class="preview">

        ${ended
          ? "Chat ended"
          : "Open conversation"
        }

      </div>


      <span
        class="conversation-status ${ended ? "ended" : ""}"
      >

        ${ended ? "ENDED" : "OPEN"}

      </span>


      <button
        type="button"
        class="delete-small"
        data-id="${escapeHtml(conversation.id)}"
        title="Delete chat"
      >
        🗑
      </button>

    </div>

  `;

}


/* =========================================================
   OPEN CONVERSATION
========================================================= */

async function openConversation(
  conversation
) {

  selectedConversation =
    conversation;


  renderConversations();


  const name =
    conversation.visitor_name ||
    "Name missing";


  chatTitleName.textContent =
    name;


  const ended =
    conversation.status ===
    "ended";


  if (ended) {

    chatStatus.textContent =
      "Chat ended";

  } else {

    chatStatus.textContent =
      "Live conversation";

  }


  endChatBtn.disabled =
    ended;

  deleteChatBtn.disabled =
    false;


  messageInput.disabled =
    ended;

  sendBtn.disabled =
    ended;


  quickReplyButtons.forEach(
    button => {

      button.disabled =
        ended;

    }
  );


  chatEndedBar.style.display =
    ended
      ? "block"
      : "none";


  if (ended) {

    messageInput.placeholder =
      "chat ended";

  } else {

    messageInput.placeholder =
      "type a reply...";

  }


  await loadMessages(
    conversation.id
  );


  messageInput.focus();

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(
  conversationId
) {

  messagesEl.innerHTML = `
    <div class="empty">
      Loading messages...
    </div>
  `;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select(
        "id, conversation_id, sender, message, created_at"
      )
      .eq(
        "conversation_id",
        conversationId
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Message loading error:",
      error
    );

    messagesEl.innerHTML = `
      <div class="empty">
        Could not load messages.
      </div>
    `;

    return;

  }


  messagesEl.innerHTML = "";


  if (!data || data.length === 0) {

    messagesEl.innerHTML = `
      <div class="empty">
        No messages yet.
      </div>
    `;

    return;

  }


  data.forEach(
    message => {

      renderMessage(
        message
      );

    }
  );


  scrollMessages();

}


/* =========================================================
   RENDER MESSAGE
========================================================= */

function renderMessage(
  message
) {

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    `message ${
      message.sender === "admin"
        ? "admin"
        : "visitor"
    }`;


  wrapper.dataset.id =
    message.id;


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "message-bubble";


  bubble.textContent =
    message.message;


  const meta =
    document.createElement(
      "div"
    );


  meta.className =
    "message-meta";


  meta.textContent =
    formatTime(
      message.created_at
    );


  wrapper.appendChild(
    bubble
  );

  wrapper.appendChild(
    meta
  );


  messagesEl.appendChild(
    wrapper
  );

}


/* =========================================================
   SEND NORMAL MESSAGE
========================================================= */

composer.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if (
      !selectedConversation ||
      selectedConversation.status ===
        "ended"
    ) {

      return;

    }


    const text =
      messageInput.value.trim();


    if (!text) {

      return;

    }


    await sendAdminMessage(
      text
    );

  }
);


/* =========================================================
   SEND ADMIN MESSAGE
========================================================= */

async function sendAdminMessage(
  text
) {

  if (
    !selectedConversation ||
    selectedConversation.status ===
      "ended"
  ) {

    return false;

  }


  messageInput.disabled =
    true;

  sendBtn.disabled =
    true;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .insert({

        conversation_id:
          selectedConversation.id,

        sender:
          "admin",

        message:
          text

      })
      .select(
        "id, conversation_id, sender, message, created_at"
      )
      .single();


  if (error) {

    console.error(
      "Message send error:",
      error
    );

    alert(
      "Could not send the message."
    );

    messageInput.disabled =
      false;

    sendBtn.disabled =
      false;

    return false;

  }


  /*
    The realtime subscription will also
    receive this message.

    Only render it here if it isn't
    already present.
  */

  if (
    !document.querySelector(
      `.message[data-id="${data.id}"]`
    )
  ) {

    const empty =
      messagesEl.querySelector(
        ".empty"
      );

    if (empty) {

      messagesEl.innerHTML = "";

    }


    renderMessage(
      data
    );

    scrollMessages();

  }


  messageInput.value =
    "";


  messageInput.disabled =
    false;

  sendBtn.disabled =
    false;


  messageInput.focus();


  return true;

}


/* =========================================================
   QUICK REPLIES
========================================================= */

quickReplyButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      async () => {

        if (
          !selectedConversation ||
          selectedConversation.status ===
            "ended"
        ) {

          return;

        }


        const message =
          button.dataset.message;


        if (!message) {

          return;

        }


        /*
          Temporarily disable all quick
          reply buttons to prevent
          accidental double sending.
        */

        quickReplyButtons.forEach(
          item => {

            item.disabled = true;

          }
        );


        await sendAdminMessage(
          message
        );


        /*
          Re-enable them if the chat
          is still open.
        */

        if (
          selectedConversation &&
          selectedConversation.status !==
            "ended"
        ) {

          quickReplyButtons.forEach(
            item => {

              item.disabled =
                false;

            }
          );

        }

      }
    );

  }
);


/* =========================================================
   END CHAT
========================================================= */

endChatBtn.addEventListener(
  "click",
  async () => {

    if (
      !selectedConversation ||
      selectedConversation.status ===
        "ended"
    ) {

      return;

    }


    const confirmed =
      confirm(
        "End this chat? The visitor will be notified and will need to start a new chat to continue."
      );


    if (!confirmed) {

      return;

    }


    endChatBtn.disabled =
      true;


    const now =
      new Date().toISOString();


    const {
      data,
      error
    } =
    await supabaseClient
      .from("conversations")
      .update({

        status:
          "ended",

        ended_at:
          now,

        updated_at:
          now

      })
      .eq(
        "id",
        selectedConversation.id
      )
      .select()
      .single();


    if (error) {

      console.error(
        "End chat error:",
        error
      );

      alert(
        "Could not end the chat."
      );

      endChatBtn.disabled =
        false;

      return;

    }


    selectedConversation =
      data;


    /*
      Update local conversation.
    */

    const index =
      conversations.findIndex(
        item =>
          item.id === data.id
      );


    if (index !== -1) {

      conversations[index] =
        data;

    }


    updateChatEndedUI();

    renderConversations();

  }
);


/* =========================================================
   UPDATE ENDED UI
========================================================= */

function updateChatEndedUI() {

  if (
    !selectedConversation
  ) {

    return;

  }


  chatStatus.textContent =
    "Chat ended";


  endChatBtn.disabled =
    true;


  messageInput.disabled =
    true;


  sendBtn.disabled =
    true;


  messageInput.placeholder =
    "chat ended";


  chatEndedBar.style.display =
    "block";


  quickReplyButtons.forEach(
    button => {

      button.disabled =
        true;

    }
  );

}


/* =========================================================
   DELETE CHAT
========================================================= */

deleteChatBtn.addEventListener(
  "click",
  async () => {

    if (
      !selectedConversation
    ) {

      return;

    }


    await deleteConversation(
      selectedConversation.id
    );

  }
);


async function deleteConversation(
  conversationId
) {

  const confirmed =
    confirm(
      "Delete this entire chat? This will permanently delete the conversation and all of its messages."
    );


  if (!confirmed) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("conversations")
      .delete()
      .eq(
        "id",
        conversationId
      );


  if (error) {

    console.error(
      "Delete error:",
      error
    );

    alert(
      "Could not delete the chat."
    );

    return;

  }


  conversations =
    conversations.filter(
      conversation =>
        conversation.id !==
        conversationId
    );


  if (
    selectedConversation &&
    selectedConversation.id ===
      conversationId
  ) {

    selectedConversation =
      null;


    chatTitleName.textContent =
      "Select a conversation";


    chatStatus.textContent =
      "Choose a visitor from the left.";


    messagesEl.innerHTML = `
      <div class="empty">
        ➜ ~/poshkin/chat $<br>
        select conversation_
      </div>
    `;


    messageInput.value =
      "";

    messageInput.disabled =
      true;

    sendBtn.disabled =
      true;

    endChatBtn.disabled =
      true;

    deleteChatBtn.disabled =
      true;

    chatEndedBar.style.display =
      "none";


    quickReplyButtons.forEach(
      button => {

        button.disabled =
          true;

      }
    );

  }


  renderConversations();

}


/* =========================================================
   REALTIME
========================================================= */

function subscribeToRealtime() {

  if (realtimeChannel) {

    supabaseClient.removeChannel(
      realtimeChannel
    );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "admin-chat-realtime"
      )


      /* -----------------------------------------------
         CONVERSATION CHANGES
      ----------------------------------------------- */

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "conversations"
        },
        payload => {

          handleConversationChange(
            payload
          );

        }
      )


      /* -----------------------------------------------
         MESSAGE INSERTS
      ----------------------------------------------- */

      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },
        payload => {

          handleNewMessage(
            payload.new
          );

        }
      )


      .subscribe();

}


/* =========================================================
   HANDLE CONVERSATION REALTIME
========================================================= */

function handleConversationChange(
  payload
) {

  if (
    payload.eventType ===
    "INSERT"
  ) {

    const exists =
      conversations.some(
        conversation =>
          conversation.id ===
          payload.new.id
      );


    if (!exists) {

      conversations.unshift(
        payload.new
      );

    }

  }


  else if (
    payload.eventType ===
    "UPDATE"
  ) {

    const index =
      conversations.findIndex(
        conversation =>
          conversation.id ===
          payload.new.id
      );


    if (index !== -1) {

      conversations[index] =
        payload.new;

    } else {

      conversations.unshift(
        payload.new
      );

    }


    if (
      selectedConversation &&
      selectedConversation.id ===
        payload.new.id
    ) {

      selectedConversation =
        payload.new;


      if (
        payload.new.status ===
        "ended"
      ) {

        updateChatEndedUI();

      } else {

        chatStatus.textContent =
          "Live conversation";

        endChatBtn.disabled =
          false;

        messageInput.disabled =
          false;

        sendBtn.disabled =
          false;

        messageInput.placeholder =
          "type a reply...";

        chatEndedBar.style.display =
          "none";


        quickReplyButtons.forEach(
          button => {

            button.disabled =
              false;

          }
        );

      }

    }

  }


  else if (
    payload.eventType ===
    "DELETE"
  ) {

    conversations =
      conversations.filter(
        conversation =>
          conversation.id !==
          payload.old.id
      );


    if (
      selectedConversation &&
      selectedConversation.id ===
        payload.old.id
    ) {

      selectedConversation =
        null;


      chatTitleName.textContent =
        "Select a conversation";


      chatStatus.textContent =
        "Choose a visitor from the left.";


      messagesEl.innerHTML = `
        <div class="empty">
          ➜ ~/poshkin/chat $<br>
          select conversation_
        </div>
      `;


      messageInput.value =
        "";

      messageInput.disabled =
        true;

      sendBtn.disabled =
        true;

      endChatBtn.disabled =
        true;

      deleteChatBtn.disabled =
        true;

      chatEndedBar.style.display =
        "none";


      quickReplyButtons.forEach(
        button => {

          button.disabled =
            true;

        }
      );

    }

  }


  /*
    Always re-render so a chat ending,
    being created, or being deleted
    moves immediately.
  */

  renderConversations();

}


/* =========================================================
   HANDLE NEW MESSAGE
========================================================= */

function handleNewMessage(
  message
) {

  if (
    !selectedConversation
  ) {

    return;

  }


  if (
    message.conversation_id !==
    selectedConversation.id
  ) {

    return;

  }


  /*
    Don't duplicate a message that
    we already rendered.
  */

  if (
    document.querySelector(
      `.message[data-id="${message.id}"]`
    )
  ) {

    return;

  }


  const empty =
    messagesEl.querySelector(
      ".empty"
    );


  if (empty) {

    messagesEl.innerHTML =
      "";

  }


  renderMessage(
    message
  );


  scrollMessages();

}


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
  "input",
  () => {

    renderConversations();

  }
);


/* =========================================================
   ENTER TO SEND
========================================================= */

messageInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      composer.requestSubmit();

    }

  }
);


/* =========================================================
   HELPERS
========================================================= */

function formatTime(
  timestamp
) {

  if (!timestamp) {

    return "";

  }


  const date =
    new Date(timestamp);


  return date.toLocaleTimeString(
    [],
    {
      hour: "numeric",
      minute: "2-digit"
    }
  );

}


function scrollMessages() {

  requestAnimationFrame(
    () => {

      messagesEl.scrollTop =
        messagesEl.scrollHeight;

    }
  );

}


function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   AUTH SESSION CHECK
========================================================= */

async function checkExistingSession() {

  const {
    data
  } =
    await supabaseClient.auth.getSession();


  if (
    data &&
    data.session
  ) {

    /*
      Make sure the logged-in user
      is actually an admin.
    */

    const {
      data: isAdmin,
      error
    } =
      await supabaseClient
        .rpc("is_admin");


    if (
      !error &&
      isAdmin === true
    ) {

      loggedIn =
        true;

      loginScreen.style.display =
        "none";

      app.style.display =
        "flex";


      await loadConversations();

      subscribeToRealtime();

    }

  }

}


/* =========================================================
   START
========================================================= */

checkExistingSession();


</script>
