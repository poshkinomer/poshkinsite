<style>

/* =========================================================
   DYNAMIC EVENT CARDS
========================================================= */

.event-card{
  position:relative;
  background:var(--paper);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:1.8rem;
  box-shadow:var(--hard);
  overflow:hidden;

  transition:
    transform .15s,
    box-shadow .15s;
}

.event-card:hover{
  transform:translate(-3px,-3px);
  box-shadow:9px 9px 0 var(--shadow);
}


/* =========================================================
   COMPLETED EVENT WITH IMAGE
========================================================= */

/*
   The image is completely invisible until hover.
*/

.event-card.has-hover-image .event-hover-photo{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  opacity:0;

  transition:
    opacity .35s ease;

  z-index:0;

  pointer-events:none;
}


/*
   Dark layer over the image so text stays readable.
*/

.event-card.has-hover-image .event-image-overlay{
  position:absolute;
  inset:0;

  background:rgba(0,0,0,.55);

  opacity:0;

  transition:
    opacity .35s ease;

  z-index:1;

  pointer-events:none;
}


/*
   Keep ALL card content above the image.
*/

.event-card.has-hover-image > :not(.event-hover-photo):not(.event-image-overlay){
  position:relative;
  z-index:2;
}


/*
   HOVER — reveal the image.
*/

.event-card.has-hover-image:hover .event-hover-photo,
.event-card.has-hover-image.tapped .event-hover-photo{
  opacity:1;
}

.event-card.has-hover-image:hover .event-image-overlay,
.event-card.has-hover-image.tapped .event-image-overlay{
  opacity:1;
}


/* =========================================================
   FLAG
========================================================= */

.event-card .flag{
  z-index:5;
}


/* =========================================================
   SECRET UPCOMING EVENT
========================================================= */

.event-card.secret-upcoming .event-secret{
  position:relative;
  z-index:2;

  transition:
    filter .5s ease,
    opacity .5s ease;
}


.event-card.secret-upcoming .event-reveal-name{
  position:absolute;

  inset:0;

  display:grid;
  place-items:center;

  text-align:center;

  padding:2rem;

  font-family:var(--disp);
  font-weight:600;
  font-size:1.6rem;

  color:var(--blue-light);

  opacity:0;

  transition:
    opacity .4s ease;

  pointer-events:none;

  z-index:4;
}


.event-card.secret-upcoming .event-reveal-name small{
  display:block;

  margin-top:.35rem;

  font-family:var(--mono);
  font-size:.65rem;

  color:var(--muted);
}


.event-card.secret-upcoming:hover .event-secret,
.event-card.secret-upcoming.tapped .event-secret{
  filter:blur(8px);
  opacity:.28;
}


.event-card.secret-upcoming:hover .event-reveal-name,
.event-card.secret-upcoming.tapped .event-reveal-name{
  opacity:1;
}


/* =========================================================
   NORMAL UPCOMING
========================================================= */

.event-card .upcoming-flag{
  background:var(--blue-light);
}


/* =========================================================
   EMPTY / ERROR
========================================================= */

.events-loading{
  grid-column:1 / -1;

  padding:3rem 1rem;

  text-align:center;

  color:var(--muted);

  font-family:var(--mono);
  font-size:.75rem;
}


/* =========================================================
   MOBILE TAP SUPPORT
========================================================= */

@media (hover:none){

  .event-card:hover{
    transform:none;
    box-shadow:var(--hard);
  }

  .event-card.has-hover-image.tapped{
    transform:translate(-3px,-3px);
    box-shadow:9px 9px 0 var(--shadow);
  }

}

</style>
</head>

<!-- =========================================================

<main class="wrap">

      ls -la ~/events

      </a>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://zrxculnvhdnqvdhrfays.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-iZ0ectVl2b38oSSuIUAXA_7sNYaQzA";

const {
  createClient
} = supabase;

const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   DOM
========================================================= */

const eventsGrid =
  document.getElementById("eventsGrid");

const menuBtn =
  document.getElementById("menuBtn");

const navLinks =
  document.getElementById("navLinks");


/* =========================================================
   MOBILE MENU
========================================================= */

if(menuBtn){

  menuBtn.addEventListener(
    "click",
    () => {

      navLinks.classList.toggle(
        "open"
      );

    }
  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================================
   SAFE URL
========================================================= */

function safeUrl(value){

  if(!value){
    return "";
  }

  try{

    /*
      Allows both:
      https://...
      ../campfire.jpeg
      /campfire.jpeg
    */

    const url =
      new URL(
        value,
        window.location.href
      );


    if(
      url.protocol !== "http:" &&
      url.protocol !== "https:"
    ){

      return "";

    }


    return url.href;

  }catch{

    return "";

  }

}


/* =========================================================
   LOAD EVENTS
========================================================= */

async function loadEvents(){

  eventsGrid.innerHTML = `
    <div class="events-loading">
      loading events...
    </div>
  `;


  const {
    data,
    error
  } =
    await db
      .from("events")
      .select("*")
      .order(
        "sort_order",
        {
          ascending:true
        }
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    console.error(
      "Events error:",
      error
    );


    eventsGrid.innerHTML = `
      <div class="events-loading">
        unable to load events
      </div>
    `;

    return;
  }


  if(!data || !data.length){

    eventsGrid.innerHTML = `
      <div class="events-loading">
        no events yet
      </div>
    `;

    return;
  }


  /*
    Completed events first,
    matching your original page.
  */

  const sortedEvents =
    [...data].sort(
      (a,b) => {

        const aStatus =
          a.status === "completed"
            ? 0
            : 1;

        const bStatus =
          b.status === "completed"
            ? 0
            : 1;


        if(
          aStatus !== bStatus
        ){

          return (
            aStatus -
            bStatus
          );

        }


        return (
          (a.sort_order || 0) -
          (b.sort_order || 0)
        );

      }
    );


  eventsGrid.innerHTML =
    sortedEvents
      .map(
        renderEvent
      )
      .join("");


  attachEventInteractions();

}


/* =========================================================
   RENDER EVENT
========================================================= */

function renderEvent(event){

  const title =
    escapeHtml(
      event.title
    );

  const date =
    escapeHtml(
      event.event_date
    );

  const location =
    escapeHtml(
      event.location
    );

  const description =
    escapeHtml(
      event.description
    );

  const icon =
    escapeHtml(
      event.icon ||
      "01"
    );


  const isCompleted =
    event.status ===
    "completed";


  const isSecret =
    !isCompleted &&
    event.reveal_mode ===
    "secret";


  const imageUrl =
    safeUrl(
      event.image_url
    );


  /* =======================================================
     COMPLETED + IMAGE
  ======================================================== */

  if(
    isCompleted &&
    imageUrl
  ){

    const signupUrl =
      safeUrl(
        event.signup_url
      );


    return `

      <article
        class="card event-card has-hover-image reveal"
      >

        <!-- HIDDEN HOVER IMAGE -->

        <img
          class="event-hover-photo"
          src="${escapeHtml(imageUrl)}"
          alt=""
          aria-hidden="true"
        >


        <!-- DARK IMAGE OVERLAY -->

        <div
          class="event-image-overlay"
          aria-hidden="true"
        ></div>


        <!-- STATUS -->

        <div class="flag">
          COMPLETED
        </div>


        <!-- ICON -->

        <div class="icon">
          ${icon}
        </div>


        <!-- TITLE -->

        <h3>
          ${title}
        </h3>


        <!-- DATE -->

        <p
          style="
            font-family:var(--mono);
            font-size:.72rem;
            color:var(--muted);
            margin-bottom:.5rem
          "
        >
          ${date} · ${location}
        </p>


        <!-- DESCRIPTION -->

        <p>
          ${description}
        </p>


        ${
          signupUrl
            ? `
              <a
                class="card-link"
                href="${escapeHtml(signupUrl)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                workshop signup ↗
              </a>
            `
            : ""
        }

      </article>

    `;

  }


  /* =======================================================
     SECRET UPCOMING
  ======================================================== */

  if(isSecret){

    return `

      <article
        class="card event-card secret-upcoming reveal"
      >

        <div class="event-secret">

          <div class="icon">
            ${icon}
          </div>


          <h3>
            ?????
          </h3>


          <p
            style="
              font-family:var(--mono);
              font-size:.72rem;
              color:var(--muted);
              margin-bottom:.5rem
            "
          >
            ${date} · ${location}
          </p>


          <p>
            ${description}
          </p>


          <span class="mono-tag">
            upcoming
          </span>

        </div>


        <div class="event-reveal-name">

          <div>

            ${title}

            <small>
              coming soon
            </small>

          </div>

        </div>

      </article>

    `;

  }


  /* =======================================================
     NORMAL UPCOMING
  ======================================================== */

  if(!isCompleted){

    const signupUrl =
      safeUrl(
        event.signup_url
      );


    return `

      <article
        class="card event-card reveal"
      >

        <div class="flag upcoming-flag">
          UPCOMING
        </div>


        <div class="icon">
          ${icon}
        </div>


        <h3>
          ${title}
        </h3>


        <p
          style="
            font-family:var(--mono);
            font-size:.72rem;
            color:var(--muted);
            margin-bottom:.5rem
          "
        >
          ${date} · ${location}
        </p>


        <p>
          ${description}
        </p>


        ${
          signupUrl
            ? `
              <a
                class="card-link"
                href="${escapeHtml(signupUrl)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                workshop signup ↗
              </a>
            `
            : ""
        }

      </article>

    `;

  }


  /* =======================================================
     COMPLETED WITHOUT IMAGE
  ======================================================== */

  const signupUrl =
    safeUrl(
      event.signup_url
    );


  return `

    <article
      class="card event-card reveal"
    >

      <div class="flag">
        COMPLETED
      </div>


      <div class="icon">
        ${icon}
      </div>


      <h3>
        ${title}
      </h3>


      <p
        style="
          font-family:var(--mono);
          font-size:.72rem;
          color:var(--muted);
          margin-bottom:.5rem
        "
      >
        ${date} · ${location}
      </p>


      <p>
        ${description}
      </p>


      ${
        signupUrl
          ? `
            <a
              class="card-link"
              href="${escapeHtml(signupUrl)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              workshop signup ↗
            </a>
          `
          : ""
      }

    </article>

  `;

}


/* =========================================================
   TAP / HOVER INTERACTIONS
========================================================= */

function attachEventInteractions(){

  document
    .querySelectorAll(
      ".event-card.has-hover-image, .event-card.secret-upcoming"
    )
    .forEach(card => {

      card.addEventListener(
        "click",
        event => {

          /*
            Don't trigger the card effect
            when clicking a signup link.
          */

          if(
            event.target.closest("a")
          ){

            return;

          }


          card.classList.toggle(
            "tapped"
          );

        }
      );

    });


  /*
    Intersection reveal animation
  */

  const observer =
    new IntersectionObserver(
      entries => {

        entries.forEach(
          entry => {

            if(
              entry.isIntersecting
            ){

              entry.target.classList.add(
                "visible"
              );

              observer.unobserve(
                entry.target
              );

            }

          }
        );

      },
      {
        threshold:.1
      }
    );


  document
    .querySelectorAll(
      ".reveal"
    )
    .forEach(
      element =>
        observer.observe(
          element
        )
    );

}


/* =========================================================
   REALTIME EVENT UPDATES
========================================================= */

const eventChannel =
  db
    .channel(
      "public-events-page"
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"events"
      },
      () => {

        loadEvents();

      }
    )

    .subscribe();


/* =========================================================
   LOAD
========================================================= */

loadEvents();


/* =========================================================
   MARQUEE SUPPORT
========================================================= */

const marquee =
  document.getElementById(
    "marquee"
  );

if(marquee){

  marquee.innerHTML +=
    marquee.innerHTML;

}

</script>

</body>
